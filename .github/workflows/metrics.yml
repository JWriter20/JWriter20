name: Metrics
on:
  # Update every other day at 06:00 UTC (1st, 3rd, 5th ... of the month)
  schedule:
    - cron: "0 6 */2 * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Regenerate on pushes to main
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # PAT with `repo` scope, stored as a repo secret (see README setup notes)
          token: ${{ secrets.METRICS_TOKEN }}
          user: JWriter20
          filename: github-metrics.svg
          template: classic

          # Count private contributions
          base: "header, activity, community, repositories, metadata"
          repositories_affiliations: owner, collaborator, organization_member
          commits_authoring: JWriter20

          # Show commit stats including private
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
